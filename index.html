<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI の砂場</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23e7f5d0' width='16' height='16'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%232f9e44'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: #24180f;
    background: #f3f7ea;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 36px 18px 64px;
  }
  h1 { margin: 0 0 8px; font-size: 32px; }
  .lead { margin: 0 0 22px; line-height: 1.6; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.card {
    display: block;
    padding: 16px 18px;
    border-radius: 16px;
    background: #fff;
    color: inherit;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(40, 60, 20, 0.08);
  }
  a.card strong { display: block; font-size: 20px; margin-bottom: 4px; }
  a.card span { color: #4a5a3a; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>AI の砂場</h1>
  <p class="lead">ブラウザで遊べるミニゲームです。スマホからも開けます。</p>
  <ul>
    <li>
      <a class="card" href="games/20261115_kyouryu_kart/">
        <strong>きょうりゅうカート</strong>
        <span>恐竜のカートで、1つのコースを3周するレース。</span>
      </a>
    </li>
    <li>
      <a class="card" href="games/20261115_kyouryu_action/">
        <strong>きょうりゅうアクション</strong>
        <span>1画面で恐竜を動かし、ジャンプとかみつきで戦う。</span>
      </a>
    </li>
    <li>
      <a class="card" href="games/20261115_kyouryu_battle/">
        <strong>きょうりゅうバトル</strong>
        <span>恐竜どうしの、コマンド式のバトル。</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
