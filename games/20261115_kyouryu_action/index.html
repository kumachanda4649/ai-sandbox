<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>峡谷のキバ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%233ecfb2'/%3E%3Crect x='9' y='3' width='6' height='4' fill='%23f3e2b8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view" width="320" height="180"></canvas>
    <div id="hud" hidden>
      <div class="hud-row">
        <div id="hp" aria-live="polite">体力</div>
        <div id="timer">残り 3:00</div>
        <div id="wave">ウェーブ 1/3</div>
      </div>
      <div id="bossbar" hidden>
        <span>ボス</span>
        <span class="track"><span id="bossfill"></span></span>
      </div>
      <div id="combo-wrap">
        <div id="combo" aria-live="polite">コンボ 0</div>
        <div id="chain" hidden><span id="chainfill"></span></div>
      </div>
    </div>
    <div id="banner" hidden>
      <div id="banner-main"></div>
      <div id="banner-sub"></div>
    </div>
    <div id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>
  <div id="pads">
    <div class="cluster">
      <button type="button" id="btn-left" aria-label="左へ移動">左</button>
      <button type="button" id="btn-right" aria-label="右へ移動">右</button>
    </div>
    <p id="hint">キーボード: ←→ 移動　スペース ジャンプ　Z かみつき</p>
    <button type="button" id="btn-sound" aria-pressed="true">音オン</button>
    <div class="cluster">
      <button type="button" id="btn-jump" aria-label="ジャンプ">ジャンプ</button>
      <button type="button" id="btn-bite" aria-label="かみつき">かみつき</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
